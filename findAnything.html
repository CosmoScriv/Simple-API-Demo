<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Place Search</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #e2e8f0);
        color: #111827;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .card {
        width: min(100%, 560px);
        background: white;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
        padding: 24px;
      }

      .title {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      .subtitle {
        margin: 0 0 18px;
        color: #475569;
      }

      .row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
      }

      .field {
        flex: 1;
      }

      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 6px;
        font-weight: 600;
      }

      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
        font-size: 0.95rem;
      }

      button {
        border: none;
        background: #0f172a;
        color: white;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        background: #334155;
      }

      button:disabled {
        opacity: 0.8;
        cursor: wait;
      }

      .results,
      .error {
        margin-top: 16px;
        padding: 12px;
        border-radius: 14px;
      }

      .results {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
      }

      .results ul {
        padding-left: 18px;
        margin: 8px 0 0;
      }

      .results li {
        margin-bottom: 8px;
      }

      .hint {
        margin-top: 12px;
        font-size: 0.9rem;
        color: #64748b;
      }

      @media (max-width: 640px) {
        .row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="title">Flexible Place Search</h1>
      <p class="subtitle">Search for nearby places by location and category.</p>

      <form id="search-form">
        <div class="row">
          <div class="field">
            <label for="location">Location</label>
            <input id="location" name="location" type="text" value="New York" placeholder="City, state, or address" />
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="restaurant">Restaurants</option>
              <option value="grocery">Grocery Stores</option>
              <option value="pharmacy">Pharmacies</option>
              <option value="cafe">Cafes</option>
              <option value="bank">Banks</option>
              <option value="park">Parks</option>
              <option value="fuel">Gas Stations</option>
              <option value="hospital">Hospitals</option>
              <option value="library">Libraries</option>
            </select>
          </div>
        </div>

        <button id="search-button" type="submit">Search</button>
      </form>

      <div id="results" class="results" style="display:none"></div>
      <div id="error" class="error" style="display:none"></div>
      <p class="hint">This example uses Nominatim for geocoding and Overpass for nearby place search.</p>
    </div>

    <script>
      const categoryMap = {
        restaurant: { label: 'Restaurants', tagType: 'amenity', tagValue: 'restaurant' },
        grocery: { label: 'Grocery Stores', tagType: 'shop', tagValue: 'grocery' },
        pharmacy: { label: 'Pharmacies', tagType: 'amenity', tagValue: 'pharmacy' },
        cafe: { label: 'Cafes', tagType: 'amenity', tagValue: 'cafe' },
        bank: { label: 'Banks', tagType: 'amenity', tagValue: 'bank' },
        park: { label: 'Parks', tagType: 'leisure', tagValue: 'park' },
        fuel: { label: 'Gas Stations', tagType: 'amenity', tagValue: 'fuel' },
        hospital: { label: 'Hospitals', tagType: 'amenity', tagValue: 'hospital' },
        library: { label: 'Libraries', tagType: 'amenity', tagValue: 'library' },
      };

      async function geocodeLocation(location) {
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(location)}&format=jsonv2&limit=1`;

        const response = await fetch(url, {
          headers: {
            'User-Agent': 'simple-api-demo/2.0',
          },
        });

        if (!response.ok) {
          throw new Error(`Geocoding failed (${response.status})`);
        }

        const data = await response.json();
        const first = data[0];

        if (!first || !first.lat || !first.lon) {
          throw new Error('Could not find that location.');
        }

        return {
          latitude: Number(first.lat),
          longitude: Number(first.lon),
        };
      }

      function buildOverpassQuery(categoryKey, latitude, longitude) {
        const config = categoryMap[categoryKey];
        const radius = 3000;

        return `[out:json][timeout:25];(nwr["${config.tagType}"="${config.tagValue}"](around:${radius},${latitude},${longitude}););out center;`;
      }

      async function searchPlaces(categoryKey, latitude, longitude) {
        const query = buildOverpassQuery(categoryKey, latitude, longitude);

        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: `data=${encodeURIComponent(query)}`,
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`Place search failed (${response.status}: ${errorText.slice(0, 200)})`);
        }

        const result = await response.json();
        return (result.elements || []).slice(0, 8);
      }

      document.getElementById('search-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        const location = document.getElementById('location').value.trim();
        const category = document.getElementById('category').value;
        const searchButton = document.getElementById('search-button');
        const resultsBox = document.getElementById('results');
        const errorBox = document.getElementById('error');

        resultsBox.style.display = 'none';
        errorBox.style.display = 'none';

        if (!location) {
          errorBox.textContent = 'Enter a location.';
          errorBox.style.display = 'block';
          return;
        }

        try {
          searchButton.textContent = 'Searching...';
          searchButton.disabled = true;

          const coordinates = await geocodeLocation(location);
          const places = await searchPlaces(category, coordinates.latitude, coordinates.longitude);
          const config = categoryMap[category];

          if (!places.length) {
            resultsBox.innerHTML = `<h3>No ${config.label.toLowerCase()} found.</h3>`;
          } else {
            const listItems = places
              .map((place) => {
                const name = place.tags?.name || 'Unnamed place';
                const street = place.tags?.['addr:street'] || 'Address not listed';
                return `<li><strong>${name}</strong><br>${street}</li>`;
              })
              .join('');

            resultsBox.innerHTML = `<h3>Nearby ${config.label}</h3><ul>${listItems}</ul>`;
          }

          resultsBox.style.display = 'block';
        } catch (error) {
          errorBox.textContent = error.message || 'An error occurred';
          errorBox.style.display = 'block';
        } finally {
          searchButton.textContent = 'Search';
          searchButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
